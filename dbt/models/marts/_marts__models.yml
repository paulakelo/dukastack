version: 2

models:
  - name: mrt_daily_sales
    description: "Daily sales and refund reconciliation mart aggregating transactions per retail shop."
    columns:
      - name: daily_sales_sk
        description: "Surrogate key hashed from shop_id and order_date."
        data_tests:
          - unique
          - not_null
      - name: shop_sk
        description: "Foreign key referencing dim_shops."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_shops')
              field: shop_sk
      - name: shop_id
        description: "Natural key identifying the physical shop."
        data_tests:
          - not_null
      - name: shop_name
        description: "Full descriptive name of the shop."
        data_tests:
          - not_null
      - name: county
        description: "Kenyan administrative county where the shop resides."
        data_tests:
          - not_null
      - name: order_date
        description: "Calendar date of sales activity, referencing dim_date."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: total_orders
        description: "Total distinct customer orders placed on this date."
        data_tests:
          - not_null
      - name: items_sold
        description: "Total quantity of items sold across all orders."
        data_tests:
          - not_null
      - name: items_refunded
        description: "Total quantity of items refunded."
        data_tests:
          - not_null
      - name: gross_sales_kes
        description: "Total gross sales revenue in KES before refunds."
        data_tests:
          - not_null
      - name: refund_amount_kes
        description: "Total refunded amount in KES."
        data_tests:
          - not_null
      - name: net_sales_kes
        description: "Net sales revenue in KES (gross_sales_kes minus refund_amount_kes)."
        data_tests:
          - not_null

  - name: mrt_product_perf
    description: "Product performance mart tracking volume and revenue per SCD2 price version."
    columns:
      - name: product_sk
        description: "Surrogate key referencing the specific SCD2 price version in dim_products."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_sk
      - name: product_id
        description: "Natural key identifying the product SKU."
        data_tests:
          - not_null
      - name: product_name
        description: "Commercial name of the product."
        data_tests:
          - not_null
      - name: category
        description: "Merchandising category of the product."
        data_tests:
          - not_null
      - name: unit_price_kes
        description: "Unit selling price in KES during this SCD2 validity window."
        data_tests:
          - not_null
      - name: price_valid_from
        description: "Start timestamp of this price version."
        data_tests:
          - not_null
      - name: price_valid_to
        description: "End timestamp of this price version (null if currently active)."
      - name: is_current_price
        description: "Boolean flag indicating if this is the active retail price."
        data_tests:
          - not_null
      - name: total_orders
        description: "Total distinct orders that purchased this product version."
        data_tests:
          - not_null
      - name: units_sold
        description: "Total units sold while this price version was active."
        data_tests:
          - not_null
      - name: gross_revenue_kes
        description: "Total gross revenue generated by this product version."
        data_tests:
          - not_null

  - name: mrt_tier_moves
    description: "Customer loyalty tier transition mart tracking customer spend per SCD2 tier window."
    columns:
      - name: customer_sk
        description: "Surrogate key referencing the specific SCD2 tier version in dim_customers."
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_sk
      - name: customer_id
        description: "Natural key identifying the customer."
        data_tests:
          - not_null
      - name: customer_name
        description: "Full customer name."
        data_tests:
          - not_null
      - name: county
        description: "County where the customer is registered."
        data_tests:
          - not_null
      - name: previous_tier
        description: "Previous loyalty tier held by this customer (null for initial version)."
      - name: current_tier
        description: "Loyalty tier active during this SCD2 validity window."
        data_tests:
          - not_null
          - accepted_values:
              values: ['basic', 'silver', 'gold']
      - name: valid_from_ts
        description: "Start timestamp of this tier window."
        data_tests:
          - not_null
      - name: valid_to_ts
        description: "End timestamp of this tier window (null if currently active)."
      - name: is_current
        description: "Boolean flag indicating if this is the customer's current active tier."
        data_tests:
          - not_null
      - name: total_orders
        description: "Total distinct orders placed by the customer while in this tier."
        data_tests:
          - not_null
      - name: items_purchased
        description: "Total item quantity purchased while in this tier."
        data_tests:
          - not_null
      - name: total_spend_kes
        description: "Total spend in KES accumulated while in this tier."
        data_tests:
          - not_null
