[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dukastack"
version = "0.1.0"
description = "A local, zero-cost analytics warehouse for point-of-sale data with tested SCD Type 2 history using dbt, DuckDB, and Dagster."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.0.0,<1.2.0",
    "dbt-core>=1.8.0,<1.9.0",
    "dbt-duckdb>=1.8.0,<1.9.0",
    "dagster>=1.8.0,<1.9.0",
    "dagster-dbt>=0.24.0,<0.25.0",
    "dagster-webserver>=1.8.0,<1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "sqlfluff>=3.1.0",
    "sqlfluff-templater-dbt>=3.1.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "dbt"
runaway_limit = 10
max_line_length = 100

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt"
profile = "dukastack"
target = "dev"

[tool.sqlfluff.indentation]
indent_unit = "space"
tab_space_size = 4
